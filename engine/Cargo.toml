[workspace]
resolver = "2"
members = [
  "crates/mg-core",
  "crates/mg-lang",
  "crates/mg-runtime",
  "crates/mg-scene",
  "crates/mg-wasm",
  "crates/mg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
mg-core = { path = "crates/mg-core" }
mg-lang = { path = "crates/mg-lang" }
mg-runtime = { path = "crates/mg-runtime" }
mg-scene = { path = "crates/mg-scene" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Small, fast WASM: `cargo build -p mg-wasm --target wasm32-unknown-unknown --profile wasm`
[profile.wasm]
inherits = "release"
opt-level = 3
strip = true
