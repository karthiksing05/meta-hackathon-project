<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14111f">
  <title>Scroll Games</title>
  <link rel="stylesheet" href="player.css">
  <script>
    // Native hosts may call SG.load before the module has finished loading; queue it.
    window.SG = window.SG || { load: function (p) { window.__sgPending = p; } };
  </script>
</head>
<body>
  <main id="app" data-palette="sunset" data-mood="playful">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>

    <section id="screen-loading" class="screen active">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Loading game…</p>
    </section>

    <section id="screen-intro" class="screen">
      <div class="intro-emoji" id="intro-emoji">🎮</div>
      <h1 id="intro-title"></h1>
      <p id="intro-copy"></p>
      <button id="btn-play" class="btn primary big">Play</button>
    </section>

    <section id="screen-game" class="screen">
      <header class="hud">
        <div class="hud-left">
          <span class="chip" id="hud-round">1/8</span>
          <span class="chip daily" id="hud-daily" hidden></span>
          <span class="chip streak" id="hud-streak" hidden>🔥 <b id="hud-streak-n">0</b></span>
          <span class="chip mult" id="hud-mult" hidden>×2</span>
        </div>
        <div class="hud-right">
          <span class="score" id="hud-score">0</span>
          <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
        </div>
      </header>
      <div class="timer" id="timer" role="progressbar" aria-label="Time left"><i id="timer-fill"></i></div>
      <div class="banner" id="banner" hidden></div>
      <article class="card" id="card">
        <div class="photo" id="photo"></div>
        <h2 class="prompt" id="prompt"></h2>
        <p class="clue" id="clue" hidden></p>
      </article>
      <div class="choices" id="choices"></div>
      <div class="countdown" id="countdown" hidden aria-live="assertive"><span id="countdown-n">3</span></div>
      <div class="pause-veil" id="pause-veil" hidden>
        <h2>Paused</h2>
        <button id="btn-resume" class="btn primary big">Resume</button>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-card" id="result-card">
        <div class="result-emoji" id="result-emoji">🏁</div>
        <p class="result-kicker" id="result-kicker">Final score</p>
        <div class="result-score" id="result-score">0</div>
        <p class="result-copy" id="result-copy"></p>
        <div class="result-stats">
          <div><b id="stat-correct">0</b><span>correct</span></div>
          <div><b id="stat-streak">0</b><span>best streak</span></div>
          <div><b id="stat-wrong">0</b><span>missed</span></div>
        </div>
        <p class="beat-line" id="beat-line" hidden></p>
        <p class="result-title" id="result-title"></p>
      </div>
      <div class="result-actions" id="result-actions">
        <button id="btn-share" class="btn primary" hidden>Challenge a friend</button>
        <button id="btn-again" class="btn">Play again</button>
        <a id="btn-get" class="btn ghost" href="#" hidden>Get Scroll Games</a>
      </div>
    </section>

    <section id="screen-error" class="screen">
      <div class="intro-emoji">😵</div>
      <h1>Couldn't load this game</h1>
      <p id="error-text"></p>
    </section>
  </main>
  <script type="module" src="player.js"></script>
</body>
</html>
