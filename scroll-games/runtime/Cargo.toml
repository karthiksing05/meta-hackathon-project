[package]
name = "sg_runtime"
version = "0.1.0"
edition = "2021"
description = "Scroll Games runtime: seeded, fixed-timestep, event-driven mini-game engine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sgtool"
path = "src/bin/sgtool.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", default-features = false, features = ["std", "no_time", "no_module", "no_closure", "no_optimize", "no_custom_syntax"] }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
