<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101320">
<title>Prompt Arcade</title>
<link rel="stylesheet" href="arcade.css">
<script type="module" src="arcade.js"></script>
</head>
<body>
<header><a href="#" class="home">◈ &nbsp; Prompt Arcade</a><span id="count"></span></header>
<main>
<section id="catalog">
  <h1>Pick a game.</h1>
  <div id="games" class="game-grid"></div>
</section>
<section id="player" hidden>
  <div class="bar"><a href="#">← All games</a><button id="restart" type="button">Restart ↻</button></div>
  <h1 id="title"></h1>
  <p id="rules"></p>
  <nav id="versions" aria-label="Game version"></nav>
  <div id="stage" class="stage"></div>
  <nav id="neighbors" aria-label="Other games"></nav>
</section>
</main>
</body>
</html>
