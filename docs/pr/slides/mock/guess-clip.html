<!doctype html>
<!-- A MOCK of the "guess what they say" Reel format, for slide 4. A fictional cartoon speaker (no real person,
     no real footage, no audio). render-clip.sh draws it at ?t=<seconds> frame by frame and makes GIF + MP4. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Figtree"; src: url("../fonts/Figtree.ttf"); font-weight: 300 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720px; height: 1280px; overflow: hidden; font-family: Figtree, sans-serif; background: #000; }
#v { position: absolute; inset: 0; background: linear-gradient(180deg, #2a3b74 0%, #3f2f86 60%, #251a52 100%); }
.top { position: absolute; top: 34px; left: 32px; right: 32px; display: flex; justify-content: space-between; color: #fff; font-size: 26px; font-weight: 700; opacity: .9; }
.cap { position: absolute; left: 50px; right: 50px; top: 760px; color: #fff; font-size: 40px; font-weight: 800; text-align: center; line-height: 1.2; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
#dim { position: absolute; inset: 0; background: rgba(8,10,30,.55); }
.pause { position: absolute; top: 110px; left: 0; right: 0; text-align: center; color: #fff; font-size: 120px; }
.q { position: absolute; top: 620px; left: 0; right: 0; text-align: center; color: #fff; font-size: 44px; font-weight: 800; }
.opts { position: absolute; left: 44px; right: 44px; top: 880px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.opt { background: #fff; border-radius: 22px; padding: 22px 20px; font-size: 27px; font-weight: 700; color: #1C1E21; min-height: 112px; display: flex; align-items: center; }
.opt.win { background: #B8F0C8; } .opt.lose { opacity: .45; }
.tag { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: 24px; font-weight: 700; letter-spacing: .08em; }
.pct { position: absolute; top: 620px; left: 0; right: 0; text-align: center; color: #B8F0C8; font-size: 44px; font-weight: 800; }
</style></head><body>
<div id="v">
  <div class="top"><span>Reels</span><span>●●●</span></div>
  <svg width="720" height="760" viewBox="0 0 720 760" style="position:absolute;top:60px;left:0">
    <rect x="0" y="560" width="720" height="200" fill="#1b1340"/>
    <rect x="230" y="520" width="260" height="190" rx="16" fill="#6b4a2b"/>
    <rect x="250" y="540" width="220" height="40" rx="8" fill="#8a6440"/>
    <text x="360" y="568" fill="#f4e3c8" font-size="22" font-weight="800" text-anchor="middle" font-family="Figtree">CITY HALL</text>
    <g id="mics"><rect x="330" y="455" width="14" height="70" fill="#333"/><rect x="376" y="455" width="14" height="70" fill="#333"/><circle cx="337" cy="452" r="16" fill="#222"/><circle cx="383" cy="452" r="16" fill="#222"/></g>
    <g id="pip">
      <rect x="250" y="360" width="220" height="190" rx="70" fill="#3d7bd9"/>
      <polygon points="345,365 375,365 360,440" fill="#f2c94c"/>
      <circle cx="360" cy="270" r="105" fill="#ffd8b0"/>
      <path d="M255 250 Q 360 120 465 250 Q 420 185 360 185 Q 300 185 255 250 Z" fill="#7a4b2a"/>
      <circle cx="322" cy="270" r="13" fill="#1C1E21"/><circle cx="398" cy="270" r="13" fill="#1C1E21"/>
      <path d="M300 238 L 340 246" stroke="#1C1E21" stroke-width="7" stroke-linecap="round"/><path d="M420 238 L 380 246" stroke="#1C1E21" stroke-width="7" stroke-linecap="round"/>
      <ellipse id="mouth" cx="360" cy="325" rx="30" ry="10" fill="#8c2f39"/>
    </g>
  </svg>
  <div class="cap" id="cap"></div>
</div>
<div id="dim" style="display:none"></div>
<div class="pause" id="pause" style="display:none">❚❚</div>
<div class="q" id="q" style="display:none">What did the mayor say?</div>
<div class="pct" id="pct" style="display:none">✓ 62% of your friends got it</div>
<div class="opts" id="opts"></div>
<div class="tag">MOCK · FICTIONAL SPEAKER</div>
<script>
const T = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const line = 'The bridge opened two hours late because…';
const ans = ['…the ribbon was too pretty', '…a goose was in charge', '…we lost the giant scissors', '…I took the scenic route'];
const WIN = 2, PICK = 2;
const $ = (id) => document.getElementById(id);
const talk = T < 2.4 || T > 4.9;
$('mouth').setAttribute('ry', talk ? (8 + 14 * Math.abs(Math.sin(T * 11))) : 6);
$('pip').setAttribute('transform', `translate(0 ${talk ? Math.sin(T * 5) * 3 : 0})`);
const typed = Math.min(line.length, Math.floor(T / 2.2 * line.length));
$('cap').textContent = T > 4.9 ? '…we lost the giant scissors.' : line.slice(0, typed);
if (T >= 2.4 && T <= 4.9) {
  $('dim').style.display = 'block'; $('pause').style.display = 'block';
  $('q').style.display = T < 4.2 ? 'block' : 'none';
  $('pct').style.display = T >= 4.2 ? 'block' : 'none';
  const shown = Math.min(4, Math.floor((T - 2.5) / 0.22) + 1);
  $('opts').innerHTML = ans.slice(0, Math.max(0, shown)).map((a, i) => {
    const cls = T >= 4.2 ? (i === WIN ? 'win' : 'lose') : (T >= 3.8 && i === PICK ? 'win' : '');
    return `<div class="opt ${cls}">${String.fromCharCode(65 + i)}. ${a}</div>`; }).join('');
}
</script></body></html>
