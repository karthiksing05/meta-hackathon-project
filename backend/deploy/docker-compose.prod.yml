# Production Compose file for the Vultr server. Copied to /srv/game-platform/app/ by the deploy workflow.
#
# Services: api (8080), games (8081), mongo (internal only).
# cloudflared is NOT here: it runs on the host as a systemd service and reaches the two published
# ports on 127.0.0.1. It is never restarted by a deployment.
#
# Never run `docker compose down -v` against this project. Data lives in bind mounts under
# /srv/game-platform/data, which no Compose command here deletes.
name: game-platform

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # --auth turns on authentication; the root user and the app user are created once, by
    # mongo-init.js, the first time the (empty) data directory is initialised.
    command: ["mongod", "--auth", "--wiredTigerCacheSizeGB", "4"]
    env_file: /etc/game-platform/mongo.env
    volumes:
      - /srv/game-platform/data/mongo:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks: [backend]          # no ports: 27017 is never published
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${API_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    env_file: /etc/game-platform/api.env
    environment:
      API_ADDR: ":8080"
      STORE: mongo
      GAMES_ROOT: /data/games
    volumes:
      - /srv/game-platform/data/games:/data/games        # read-write: the API publishes packages
    ports:
      - "127.0.0.1:8080:8080"    # loopback only, for cloudflared
    networks: [backend, edge]
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  games:
    image: ${GAMES_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    environment:
      GAMES_ADDR: ":8081"
      GAMES_PUBLIC_DIR: /data/games/published    # only published/ is served; tmp/ and private/ are not
    volumes:
      - /srv/game-platform/data/games:/data/games:ro     # read-only
    ports:
      - "127.0.0.1:8081:8081"    # loopback only, for cloudflared
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true     # mongo is reachable only from here, with no route to the outside
  edge: {}
