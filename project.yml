# Fallback project spec for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Only needed if FacebookClone.xcodeproj won't open in your Xcode version:
#   brew install xcodegen && xcodegen generate
name: FacebookClone
options:
  bundleIdPrefix: com.hackathon
  deploymentTarget:
    iOS: "17.0"
targets:
  FacebookClone:
    type: application
    platform: iOS
    sources:
      - FacebookClone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathon.FacebookClone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Facebook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
