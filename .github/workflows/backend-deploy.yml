name: Backend deploy

# Deploys only when commits are pushed or merged into the exact branch `Prod`.
on:
  push:
    branches: [Prod]

concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false   # never interrupt a deployment that is mid-flight

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:   # a real MongoDB, so the store's queries and aggregations are tested before anything ships
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generator self-test (a scripted Muse, no key)
        run: node generator/selftest.mjs
      - name: Shell script syntax
        run: bash -n deploy/deploy.sh && bash -n deploy/backup.sh && bash -n deploy/dbinit.sh
      - name: Compose file is valid
        run: |
          sudo mkdir -p /etc/game-platform && sudo touch /etc/game-platform/api.env /etc/game-platform/mongo.env
          API_IMAGE=x GAMES_IMAGE=y GENERATOR_IMAGE=z docker compose -f deploy/docker-compose.prod.yml config -q

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push games
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: games
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-games:${{ github.sha }}
          cache-from: type=gha,scope=games
          cache-to: type=gha,mode=max,scope=games
      - name: Build and push generator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: generator
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-generator:${{ github.sha }}
          cache-from: type=gha,scope=generator
          cache-to: type=gha,mode=max,scope=generator

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # lets this job's token pull the images on the server
    environment: production   # holds VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, MUSE_API_KEY (and optional API_PUBLIC_URL)
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key: no trust-on-first-use
      - name: Copy deployment files
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            backend/deploy/docker-compose.prod.yml backend/deploy/mongo-init.js \
            backend/deploy/deploy.sh backend/deploy/dbinit.sh backend/deploy/backup.sh \
            "$USER_@$HOST:/srv/game-platform/app/"
      - name: Give the generator the Muse key (only if the secret is set)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
        run: |
          if [ -z "$MUSE_API_KEY" ]; then
            echo "MUSE_API_KEY is not set in the production environment: leaving /etc/game-platform/generator.env as it is"
            exit 0
          fi
          # The key goes over SSH stdin (never on a command line) into a root-only file on the server, which
          # the generator container reads when it is recreated by the deploy below. GitHub masks it in logs.
          printf 'MUSE_API_KEY=%s\n' "$MUSE_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            'umask 077 && cat > /etc/game-platform/generator.env.new && mv /etc/game-platform/generator.env.new /etc/game-platform/generator.env'
      - name: Deploy (rolls back automatically if /readyz fails)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          # The registry token is short-lived (this job only) and goes over SSH stdin, so no
          # long-lived registry credential is stored on the server.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && chmod +x /srv/game-platform/app/*.sh && /srv/game-platform/app/deploy.sh deploy '$TAG'; rc=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$rc"
      - name: Verify public readiness (optional)
        id: verify
        if: ${{ vars.API_PUBLIC_URL != '' }}
        env:
          URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          for i in $(seq 1 15); do
            curl -fsS --max-time 5 "$URL/readyz" && exit 0
            sleep 4
          done
          echo "public readiness failed" >&2
          exit 1
      - name: Roll back if public readiness failed
        # deploy.sh already rolls back a local readiness failure. This covers the case where the
        # local check passed but the public one (through Cloudflare) did not.
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "/srv/game-platform/app/deploy.sh rollback"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
