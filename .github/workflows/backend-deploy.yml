name: Backend deploy

# Deploys only when commits are pushed or merged into the exact branch `Prod`.
on:
  push:
    branches: [Prod]

concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false   # never interrupt a deployment that is mid-flight

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:   # a real MongoDB, so the store's queries and aggregations are tested before anything ships
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generator self-test (a scripted Muse, no key)
        run: node generator/selftest.mjs
      - name: Shell script syntax
        run: bash -n deploy/deploy.sh && bash -n deploy/backup.sh && bash -n deploy/dbinit.sh && bash -n deploy/apply-env.sh
      - name: Compose file is valid
        run: |
          sudo mkdir -p /etc/game-platform && sudo touch /etc/game-platform/api.env /etc/game-platform/mongo.env
          API_IMAGE=x GAMES_IMAGE=y GENERATOR_IMAGE=z docker compose -f deploy/docker-compose.prod.yml config -q

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push games
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: games
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-games:${{ github.sha }}
          cache-from: type=gha,scope=games
          cache-to: type=gha,mode=max,scope=games
      - name: Build and push generator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: generator
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/bubbles-generator:${{ github.sha }}
          cache-from: type=gha,scope=generator
          cache-to: type=gha,mode=max,scope=generator

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # lets this job's token pull the images on the server
    environment: production   # holds VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, MUSE_API_KEY; variables API_ENV, GENERATOR_ENV, API_PUBLIC_URL (all optional)
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key: no trust-on-first-use
      - name: Copy deployment files
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            backend/deploy/docker-compose.prod.yml backend/deploy/mongo-init.js \
            backend/deploy/deploy.sh backend/deploy/dbinit.sh backend/deploy/backup.sh backend/deploy/apply-env.sh \
            "$USER_@$HOST:/srv/game-platform/app/"
      - name: Apply the settings kept in GitHub to the server's env files
        # One place for config: GitHub. API_ENV and GENERATOR_ENV are environment *variables* holding KEY=VALUE lines
        # (plain switches such as DEBUG_DELETE=1 or SPONSOR_USERS=fizzco); MUSE_API_KEY is a *secret*. They are merged
        # into /etc/game-platform/api.env and generator.env: only the keys you set change, everything else stays, so the
        # server's own secrets (Mongo password, JWT_SECRET) are never touched. Nothing set = nothing changes.
        id: envs
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          API_ENV: ${{ vars.API_ENV }}
          GENERATOR_ENV: ${{ vars.GENERATOR_ENV }}
        run: |
          S="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $USER_@$HOST"
          api=""; gen=""
          if [ -n "$API_ENV" ]; then
            printf '%s\n' "$API_ENV" | $S 'sh /srv/game-platform/app/apply-env.sh /etc/game-platform/api.env'
            api=1
          fi
          # The key goes over SSH stdin (never on a command line). GitHub masks it in logs.
          if [ -n "$MUSE_API_KEY" ] || [ -n "$GENERATOR_ENV" ]; then
            { printf '%s\n' "$GENERATOR_ENV"; [ -z "$MUSE_API_KEY" ] || printf 'MUSE_API_KEY=%s\n' "$MUSE_API_KEY"; } \
              | $S 'sh /srv/game-platform/app/apply-env.sh /etc/game-platform/generator.env'
            gen=1
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "gen=$gen" >> "$GITHUB_OUTPUT"
      - name: Deploy (rolls back automatically if /readyz fails)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          # The registry token is short-lived (this job only) and goes over SSH stdin, so no
          # long-lived registry credential is stored on the server.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && chmod +x /srv/game-platform/app/*.sh && /srv/game-platform/app/deploy.sh deploy '$TAG'; rc=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$rc"
      - name: Restart what read new settings
        if: ${{ steps.envs.outputs.api != '' || steps.envs.outputs.gen != '' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          API: ${{ steps.envs.outputs.api }}
          GEN: ${{ steps.envs.outputs.gen }}
        run: |
          [ -z "$GEN" ] || ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" "/srv/game-platform/app/deploy.sh restart-generator"
          [ -z "$API" ] || ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" "/srv/game-platform/app/deploy.sh restart-api"
      - name: Verify public readiness (optional)
        id: verify
        if: ${{ vars.API_PUBLIC_URL != '' }}
        env:
          URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          for i in $(seq 1 15); do
            curl -fsS --max-time 5 "$URL/readyz" && exit 0
            sleep 4
          done
          echo "public readiness failed" >&2
          exit 1
      - name: Roll back if public readiness failed
        # deploy.sh already rolls back a local readiness failure. This covers the case where the
        # local check passed but the public one (through Cloudflare) did not.
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "/srv/game-platform/app/deploy.sh rollback"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
